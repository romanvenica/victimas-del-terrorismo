# /etc/nginx/sites-available/agromarket  (reemplazar tu-dominio.com.ar)
# Certificado: sudo certbot --nginx -d tu-dominio.com.ar -d www.tu-dominio.com.ar
server {
    listen 80;
    server_name tu-dominio.com.ar www.tu-dominio.com.ar;
    return 301 https://tu-dominio.com.ar$request_uri;
}
server {
    listen 443 ssl http2;
    server_name tu-dominio.com.ar;
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 220m;   # 20 fotos x 10 MB + margen
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

    # Fotos servidas directo por Nginx (sin pasar por Node)
    location /uploads/ {
        alias /opt/agromarket/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    location /static/ {
        alias /opt/agromarket/src/public/;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Víctimas del terrorismo en Argentina</title>
<style>
  :root{
    --bg:#14100c; --panel:#1c1712; --ink:#e8e0d4; --dim:#a99d8b;
    --line:#2e2822; --mil:#5fae5a; --pol:#5f9fd6; --civ:#e0b93f; --hombre:#5f9fd6; --hi:#d94f38;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  /* barras de desplazamiento invisibles (se sigue pudiendo scrollear y arrastrar) */
  html,body,.plot,aside.filters,.card,.chips{scrollbar-width:none;-ms-overflow-style:none}
  html::-webkit-scrollbar,body::-webkit-scrollbar,.plot::-webkit-scrollbar,
  aside.filters::-webkit-scrollbar,
  .card::-webkit-scrollbar,.chips::-webkit-scrollbar{width:0;height:0;display:none}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{display:flex;height:100vh;flex-direction:column;overflow:hidden}
  header{padding:14px 40px;border-bottom:1px solid var(--line);text-align:center}
  .titulo{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;
    cursor:pointer;transition:opacity .15s}
  .titulo:hover{opacity:.82}
  .cruzblanca{width:22px;height:33px;flex:none}
  h1{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:.2px;margin:0;line-height:1.2}
  .sub{color:var(--dim);font-size:13.5px;margin-top:8px;max-width:70ch;line-height:1.5}
  main{display:flex;flex:1;min-height:0;overflow:hidden}
  aside.filters{width:272px;flex:none;border-right:1px solid var(--line);padding:22px 20px;overflow-y:auto}
  .allbtn{width:100%;text-align:left;background:var(--hi);color:#fff;border:none;padding:11px 14px;
    font-family:var(--serif);font-size:16px;border-radius:2px;cursor:pointer;margin-bottom:22px}
  .allbtn:hover{filter:brightness(1.08)}
  .grp{margin-bottom:20px}
  .grp h2{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);margin:0 0 9px}
  .opt{display:flex;align-items:center;gap:9px;padding:5px 6px;cursor:pointer;border-radius:2px;
    font-size:13.5px;color:var(--ink);user-select:none}
  .opt:hover{background:#241d16}
  .opt .box{width:13px;height:13px;border:1.5px solid var(--dim);border-radius:2px;flex:none;position:relative}
  .opt.on .box{background:var(--hi);border-color:var(--hi)}
  .opt.on .box::after{content:"";position:absolute;left:3px;top:0px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .opt .lb{flex:1;min-width:0}
  .opt .ct{margin-left:auto;flex:none;min-width:3.4ch;text-align:right;
    color:var(--dim);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  section.stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  aside.list{width:270px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  aside.list h2{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin:0;padding:20px 20px 8px}
  .lsearch{padding:0 16px 12px;position:relative}
  .lsearch .borrar{position:absolute;right:24px;top:calc((100% - 12px)/2);transform:translateY(-50%);
    width:22px;height:22px;padding:0;display:none;align-items:center;justify-content:center;
    background:none;border:none;color:var(--dim);font-size:17px;line-height:1;cursor:pointer;
    border-radius:3px}
  .lsearch .borrar:hover{color:var(--ink);background:#241d16}
  .lsearch .borrar.show{display:flex}
  .lsearch input{width:100%;background:#14100c;border:1px solid var(--line);border-radius:4px;
    color:var(--ink);font-family:var(--sans);font-size:13px;padding:8px 10px;outline:none}
  .lsearch input:focus{border-color:var(--hi)}
  .lsearch input::placeholder{color:var(--dim)}
  .listscroll{flex:1;overflow-y:auto;padding:0 8px 14px;
    scrollbar-width:thin;scrollbar-color:#4a3f34 transparent}
  .listscroll::-webkit-scrollbar{width:10px}
  .listscroll::-webkit-scrollbar-track{background:transparent}
  .listscroll::-webkit-scrollbar-thumb{background:#4a3f34;border-radius:5px;
    border:2px solid var(--bg);background-clip:padding-box}
  .listscroll::-webkit-scrollbar-thumb:hover{background:#5f5142;background-clip:padding-box}
  .lrow{display:flex;align-items:center;gap:10px;padding:5px 10px;cursor:pointer;border-radius:3px;font-size:13px;line-height:1.25}
  .lrow:hover{background:#241d16}
  .lrow .lfoto{width:34px;height:34px;flex:none;border-radius:3px;object-fit:cover;background:#0d0a07}
  .lrow .lhueco{width:34px;flex:none}
  .lrow svg{width:15px;height:15px;flex:none}
  .lrow .ly{margin-left:auto;color:var(--dim);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .plot{flex:1;min-height:0;overflow:auto;padding:14px 30px;cursor:grab;touch-action:none}
  .plot.drag{cursor:grabbing}
  .plot.drag *{cursor:grabbing}
  /* celular: el dibujo se arma una sola vez y el zoom es puro estirado visual */
  .zoomwrap{position:relative}
  .lienzo{position:absolute;left:0;top:0;transform-origin:0 0}
  svg{display:block}
  .yr text{fill:var(--dim);font-size:12px;font-weight:600;font-family:var(--sans)}
  .yr line{stroke:var(--line)}
  .yrlbl{cursor:pointer}
  .yrlbl .yrbadge{fill:rgba(232,224,212,.06);transition:fill .12s}
  .yrlbl:hover .yrbadge{fill:rgba(232,224,212,.10)}
  .yrlbl.on .yrbadge{fill:var(--hi)}
  .yr .yrlbl.on text{fill:#fff}
  .person{cursor:pointer}
  .person:hover{opacity:.6}
  rect.selbox{fill:none;stroke:var(--hi);stroke-width:2;rx:3;pointer-events:none}
  /* leyenda: cuadro flotante arriba a la derecha del gráfico */
  footer#legend{position:absolute;top:14px;left:18px;z-index:4;pointer-events:none;
    background:rgba(20,16,12,.93);border:1px solid var(--line);border-radius:3px;
    padding:11px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    color:var(--dim);font-size:12.5px;font-weight:600}
  .cerrarpanel{display:none}
  .lgtit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
  .lg{display:inline-flex;align-items:center;gap:8px}
  .lg svg{width:17px;height:17px}
  /* lupas para agrandar y achicar el gráfico */
  .zoombar{position:absolute;top:14px;right:18px;z-index:5;display:flex;flex-direction:column;gap:6px}
  .zoombar button{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;
    background:rgba(20,16,12,.93);border:1px solid var(--line);border-radius:3px;
    color:var(--ink);cursor:pointer}
  .zoombar button:hover:not(:disabled){border-color:#5c4d3f;background:#241d16}
  .zoombar button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
  .zoombar button:disabled{opacity:.35;cursor:default}
  .zoombar svg{width:19px;height:19px}
  /* columna de año: se sombrea al elegirla */
  /* solo marca la columna elegida: no se toca, se elige con el año de abajo */
  rect.yearbg{fill:transparent;pointer-events:none}
  rect.yearbg.on{fill:rgba(232,224,212,.11)}
  .scrim{position:fixed;inset:0;background:rgba(6,4,2,.62);display:none;z-index:9}
  .scrim.show{display:block}
  .card{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--panel);
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;z-index:10;
    padding:26px 28px;overflow-y:auto}
  .card.show{transform:none}
  /* la × viaja con el scroll: la franja es de alto cero para no correr el texto,
     y solo el botón recibe los clicks */
  .card .xwrap{position:sticky;top:0;height:0;z-index:4;text-align:right;pointer-events:none}
  .card .x{pointer-events:auto;width:38px;height:38px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(20,16,12,.92);border:1px solid var(--line);border-radius:50%;
    color:var(--dim);font-size:28px;line-height:1;cursor:pointer;
    transition:color .12s,background .12s}
  .card .x:hover{color:var(--ink);background:#241d16}
  .card .nmrow{display:flex;align-items:center;gap:13px;margin:6px 46px 14px 0}
  .card .nmico{width:34px;height:34px;flex:none}
  .card .nmcat{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c9bda9;margin-bottom:3px}
  .card .nm{font-family:var(--serif);font-size:23px;line-height:1.2;margin:0}
  /* display:inline-block a mano: la regla general pone los svg en bloque y la
     cruz se caía al renglón de abajo en vez de quedar pegada al nombre */
  .card .cruznm{display:inline-block;width:11px;height:17px;margin-left:9px;
    vertical-align:-2px;flex:none}
  .card .nm .junto{white-space:nowrap}
  .card .meta .cruz{font-weight:800;font-size:15px;color:#c9bda9}
  .card .meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:18px 0;font-size:13.5px}
  .card .meta dt{color:var(--dim);font-weight:600}
  .card .meta dd{margin:0}
  .card .foto{display:none;width:100%;max-width:260px;border-radius:8px;margin:2px 0 16px;border:1px solid var(--line)}
  .card .foto.show{display:block}
  .card .rel{margin:0;padding-top:17px;border-top:1px solid var(--line);font-family:var(--serif);
    font-size:14.5px;line-height:1.62;color:#d8cfc0;white-space:pre-wrap}
  .card .rel + .rel{margin-top:17px}
  .card .src{margin-top:18px;color:var(--dim);font-size:12.5px;font-weight:500}
  .empty{color:var(--dim);text-align:center;margin-top:26vh;font-family:var(--serif);font-size:16px}
  #tip .cruz{font-weight:800;font-size:17px}
  #tip .tcat{display:block;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#c9bda9;margin-bottom:4px}
  #tip .tnom{display:block;font-size:19px;font-weight:600}
  #tip .trow{display:flex;align-items:center;gap:12px}
  #tip .tico{width:28px;height:28px;flex:none}
  #tip .tthumb{width:104px;height:104px;border-radius:5px;object-fit:cover;flex:none;display:none;margin-right:3px}
  #tip{position:fixed;pointer-events:none;z-index:20;background:#000;border:1px solid var(--line);
    color:var(--ink);font-family:var(--sans);font-size:16px;padding:11px 15px;border-radius:5px;
    white-space:nowrap;display:none;transform:translate(-50%,-118%)}
  /* cartel de entrada: se va al tocar en cualquier lado */
  .intro{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(6,4,2,.55);cursor:pointer;padding:24px;
    transition:opacity .45s ease,visibility .45s ease}
  .intro.oculto{opacity:0;visibility:hidden}
  /* cartel flotante: el gráfico se sigue viendo detrás, apenas velado */
  .introcaja{max-width:640px;text-align:center;background:rgba(20,16,12,.94);
    border:1px solid var(--line);border-radius:6px;padding:36px 40px;
    box-shadow:0 18px 60px rgba(0,0,0,.6)}
  .introfotos{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:30px}
  .introfotos img{width:78px;height:78px;object-fit:cover;border-radius:4px;
    border:1px solid var(--line);display:block}
  /* el nombre aparece flotando al pasar el mouse, como en el gráfico */
  .introfoto{position:relative;display:inline-block;line-height:0}
  .introfoto::after{
    content:attr(data-nom);position:absolute;left:50%;bottom:calc(100% + 9px);
    transform:translateX(-50%);white-space:nowrap;z-index:2;
    background:#000;border:1px solid var(--line);border-radius:4px;
    color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.2;
    padding:7px 11px;opacity:0;pointer-events:none;transition:opacity .12s
  }
  .introfoto:hover::after{opacity:1}
  .intro p{font-family:var(--serif);color:var(--ink);font-size:20px;line-height:1.6;margin:0 0 15px}
  .intro p:last-child{margin-bottom:0}
  .intro p.chica{font-size:17px;color:#c9bda9}
  @media (max-width:760px){
    .introcaja{padding:26px 20px}
    .introfotos img{width:56px;height:56px}
    .intro p{font-size:17px}
    .intro p.chica{font-size:15px}
  }
  .fabf{display:none}
  /* ===================== MÓVIL ===================== */
  .mobilebar{display:none}
  @media(max-width:760px){
    body{overflow:hidden;height:100dvh}
    header{padding:10px 14px}
    .titulo{display:block}
    h1{display:inline;font-size:16.5px}
    .cruzblanca{display:inline-block;width:13px;height:20px;vertical-align:-3px;margin-left:7px}
    main{flex-direction:column;overflow:hidden;flex:1;min-height:0}

    /* dos botones bajo el título: abren los paneles laterales */
    .mobilebar{display:flex;justify-content:space-between;align-items:center;
      padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
    .mobilebar button{width:25%;background:#1c1712;border:1px solid var(--line);
      color:var(--ink);font-family:var(--sans);font-size:13px;font-weight:600;
      padding:9px 0;border-radius:4px;cursor:pointer}
    .mobilebar button:active{background:#241d16;border-color:#5c4d3f}

    /* paneles laterales: entran desde cada borde */
    aside.filters,aside.list{position:fixed;top:0;bottom:0;z-index:11;
      width:74%;max-width:280px;background:var(--panel);
      transition:transform .22s ease;box-shadow:0 0 30px rgba(0,0,0,.5)}
    aside.filters{display:block;left:0;right:auto;border-right:1px solid var(--line);
      overflow-y:auto;padding:18px 16px;transform:translateX(-101%)}
    aside.list{display:flex;flex-direction:column;right:0;left:auto;
      border-left:1px solid var(--line);overflow:hidden;transform:translateX(101%)}
    aside.filters.abierto,aside.list.abierto{transform:none}
    .listscroll{max-height:none;overflow-y:auto}
    .cerrarpanel{display:block;flex:none;width:34px;height:34px;margin:0 0 10px auto;
      background:none;border:1px solid var(--line);border-radius:4px;
      color:var(--dim);font-size:20px;line-height:1;cursor:pointer}
    aside.list .cerrarpanel{margin:14px 14px 4px auto}
    aside.list h2{padding:0 20px 8px}

    /* el gráfico queda siempre a la vista y se come todo el alto que sobra */
    section.stage{display:flex;flex:1;min-height:0}
    .stage{min-height:0}
    .plot{flex:1;min-height:0;height:auto;overflow:auto;padding:10px 8px}

    /* leyenda flotando arriba a la izquierda, como en la PC pero mas compacta */
    footer#legend{top:10px;left:10px;gap:6px;padding:8px 10px;font-size:12px}
    .lgtit{display:none}
    .lg{gap:7px}
    .lg svg{width:15px;height:15px}

    /* ficha: sube desde abajo y se cierra tocándola */
    .card{width:100%;max-width:100%;height:82vh;top:auto;bottom:0;left:0;border-left:none;
      border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(100%);
      z-index:13;cursor:pointer}
    .card.show{transform:none}
    .card .grip{display:block;width:38px;height:4px;background:var(--dim);border-radius:2px;margin:2px auto 12px}
    .card .xwrap{margin-top:-30px}
    .card .x{width:34px;height:34px;font-size:25px}
    .card .nmrow{margin-right:40px}
  }
  .card .grip{display:none}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="introcaja">
    <div class="introfotos" id="introfotos"></div>
    <p>En memoria de los 1050 argentinos asesinados por grupos terroristas en los años 70&rsquo;</p>
    <p class="chica">Y por los militares y policías que dieron su vida por nuestro país.</p>
    <p class="chica">Y por nuestros héroes que todavía están en prisión.</p>
  </div>
</div>
<header>
  <div class="titulo" id="inicio" role="button" tabindex="0" title="Volver al inicio">
    <h1>Víctimas del terrorismo en Argentina</h1>
    <svg class="cruzblanca" viewBox="0 0 24 36" aria-hidden="true">
      <rect x="9.2" y="0" width="5.6" height="36" fill="#fff"></rect>
      <rect x="1.6" y="8.6" width="20.8" height="5.6" fill="#fff"></rect>
    </svg>
  </div>
</header>
<main>
  <div class="mobilebar">
    <button type="button" id="btnFiltro">Filtro</button>
    <button type="button" id="btnListado">Listado</button>
  </div>
  <aside class="filters" id="side">
    <button type="button" class="cerrarpanel">&times;</button>
    <button class="allbtn" id="all">Ver todos</button>
    <div id="filters"></div>
  </aside>
  <section class="stage show" id="stage">
    <div class="plot" id="plot"></div>
    <div class="zoombar" id="zoombar">
      <button type="button" id="zmas" title="Agrandar" aria-label="Agrandar el gráfico">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="8.6" cy="8.6" r="5.4"></circle><line x1="12.7" y1="12.7" x2="17.2" y2="17.2"></line>
          <line x1="6.1" y1="8.6" x2="11.1" y2="8.6"></line><line x1="8.6" y1="6.1" x2="8.6" y2="11.1"></line>
        </svg>
      </button>
      <button type="button" id="zmenos" title="Achicar" aria-label="Achicar el gráfico">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="8.6" cy="8.6" r="5.4"></circle><line x1="12.7" y1="12.7" x2="17.2" y2="17.2"></line>
          <line x1="6.1" y1="8.6" x2="11.1" y2="8.6"></line>
        </svg>
      </button>
    </div>
    <footer id="legend"></footer>
  </section>
  <aside class="list">
    <button type="button" class="cerrarpanel">&times;</button>
    <h2 id="listhead">Personas</h2>
    <div class="lsearch">
    <input id="lq" type="text" placeholder="Buscar por nombre…" autocomplete="off">
    <button type="button" class="borrar" id="lqx" aria-label="Borrar la búsqueda">&times;</button>
  </div>
    <div class="listscroll" id="listscroll"></div>
  </aside>
</main>
<button class="fabf" id="fab">Filtros</button>
<div id="tip"></div>
<div class="scrim" id="scrim"></div>
<aside class="card" id="card"></aside>

<script>
let DATA = [];
let FOTOS = new Set();   // claves que efectivamente tienen retrato

const NS="http://www.w3.org/2000/svg";
const MINY=1960, MAXY=1989;
const GRUPO_FIN=1968;   // del 60 al 68 van todos juntos en una columna
function grupoDe(y){ return y<=GRUPO_FIN ? MINY : y; }
function etiquetaGrupo(g){
  return g===MINY ? "'60-'68" : "'"+String(g).slice(2);
}
function nombreGrupo(g){
  return g===MINY ? MINY+"-"+GRUPO_FIN : String(g);
}
const COL={mil:"#5fae5a", pol:"#5f9fd6", civ:"#e0b93f", nino:"#f2ede4", mujer:"#e58fc0"};

const RAMAS_FFAA = ["Ejército","Armada","Fuerza Aérea","Gendarmería / Prefectura"];

const FILTERS = [
  {key:"cat", title:"Categoría", opts:[["civil","Civiles"],["ffaa","Fuerzas Armadas"],["policia","Policía / Seguridad"]]},
  {key:"rama", title:"Fuerza", opts:[["Ejército","Ejército"],["Armada","Armada"],["Fuerza Aérea","Fuerza Aérea"],["Gendarmería / Prefectura","Gendarmería / Prefectura"],["Policía Federal","Policía Federal"],["Policía provincial","Policía provincial"],["Servicio Penitenciario","Servicio Penitenciario"]]},
  {key:"s",  title:"Género", opts:[["M","Hombres"],["F","Mujeres"]]},
  {key:"nino",title:"Edad", opts:[["si","Niños (menores de 18)"],["no","Adultos"]]},
  {key:"tg", title:"Tipo de hecho", opts:[["Explosivo","Explosivo / bomba"],["Arma de fuego","Arma de fuego"],["Enfrentamiento","Enfrentamiento"],["Otro","Otro"]]},
];

const state={};
FILTERS.forEach(function(f){ state[f.key]=new Set(); });

// ---- clasificación de cada persona en un tipo de ícono + color ----
// categoría sin mirar la edad: sirve para filtrar (un niño civil sigue siendo civil)
function categoriaGrupo(d){
  if(d.g!=="Militar") return "civil";
  return RAMAS_FFAA.indexOf(d.rama)>=0 ? "ffaa" : "policia";
}
function personType(d){
  if(d.nino) return "nino";
  return categoriaGrupo(d);
}
function personColor(t){
  if(t==="ffaa") return COL.mil;    // militares verde
  if(t==="policia") return COL.pol; // policía azul
  if(t==="nino") return COL.nino;   // niños blanco
  return COL.civ;                   // civiles amarillo
}

// ---- íconos (viewBox 0..16), devuelven markup interno ----
function iconPaths(t){
  switch(t){
    case "ffaa": // casco militar
      return '<path d="M8 2.4c-3.4 0-5.6 2.4-5.6 6.1H13.6C13.6 4.8 11.4 2.4 8 2.4Z"/>'+
             '<rect x="1.4" y="8.5" width="13.2" height="2.1" rx="1"/>'+
             '<rect x="7.2" y="2" width="1.6" height="1.6" rx="0.4"/>';
    case "policia": // escudo / placa
      return '<path d="M8 1.8 13 3.6V8.2C13 11 10.9 13.2 8 14.2 5.1 13.2 3 11 3 8.2V3.6Z"/>'+
             '<path d="M8 5.2l0.9 1.9 2 0.2-1.5 1.4 0.4 2L8 9.7 6.2 10.7l0.4-2L5.1 7.3l2-0.2Z" fill="#14100c"/>';
    case "mujer": // figura con vestido
      return '<circle cx="8" cy="4.3" r="2.6"/>'+
             '<path d="M8 7.2 12.4 14.6H3.6Z"/>';
    case "nino": // figura chica (cabeza + cuerpo redondeado)
      return '<circle cx="8" cy="4.6" r="2.3"/>'+
             '<circle cx="8" cy="10.6" r="3.4"/>';
    case "civil": // todos los civiles: figura de persona (cabeza + hombros)
      return '<circle cx="8" cy="4.3" r="2.6"/>'+
             '<path d="M2.6 14.6C2.6 9.9 13.4 9.9 13.4 14.6Z"/>';
    default: // hombre: cabeza + hombros
      return '<circle cx="8" cy="4.3" r="2.6"/>'+
             '<path d="M2.6 14.6C2.6 9.9 13.4 9.9 13.4 14.6Z"/>';
  }
}

function matchVal(d,key,val){
  if(key==="nino") return val==="si" ? d.nino===true : d.nino!==true;
  if(key==="cat") return categoriaGrupo(d)===val;
  return d[key]===val;
}
function passes(d){
  return FILTERS.every(function(f){
    const s=state[f.key]; if(s.size===0) return true;
    return Array.from(s).some(function(v){return matchVal(d,f.key,v);});
  });
}
function countFor(key,val){
  return DATA.filter(function(d){
    const ok=FILTERS.every(function(f){
      if(f.key===key) return true;
      const s=state[f.key]; if(s.size===0) return true;
      return Array.from(s).some(function(v){return matchVal(d,f.key,v);});
    });
    return ok && matchVal(d,key,val);
  }).length;
}

function norm(s){
  return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
}
function drawList(){
  const head=document.getElementById("listhead");
  const box=document.getElementById("listscroll");
  const q=norm(document.getElementById("lq").value.trim());
  let items=listPool;
  if(anioSel!==null) items=items.filter(function(d){ return grupoDe(d.y)===anioSel; });
  if(q){
    // cada palabra de la búsqueda debe aparecer en el nombre, en cualquier orden
    const términos=q.split(/\s+/).filter(Boolean);
    items=items.filter(function(d){
      const n=norm(d.n);
      return términos.every(function(t){ return n.indexOf(t)!==-1; });
    });
  }
  head.textContent = (anioSel!==null ? nombreGrupo(anioSel)+" · " : "") +
                     items.length + (items.length===1?" persona":" personas");
  const sorted=items.slice().sort(function(a,b){
    return a.n.localeCompare(b.n,"es",{sensitivity:"base"});
  });
  box.innerHTML="";
  const frag=document.createDocumentFragment();
  sorted.forEach(function(d){
    const t=personType(d);
    const row=document.createElement("div"); row.className="lrow";
    row.innerHTML=(tieneFoto(d)
        ? '<img class="lfoto" src="'+fotoThumb(d)+'" alt="" loading="lazy">'
        : '<span class="lhueco"></span>')+
      '<svg viewBox="0 0 16 16" fill="'+personColor(t)+'">'+iconPaths(t)+'</svg>'+
      '<span>'+esc(d.n)+'</span><span class="ly">'+d.y+'</span>';
    // desde el listado la ficha se abre encima: el panel queda como estaba,
    // con la búsqueda y el scroll intactos para seguir mirando nombres
    row.addEventListener("click",function(){ openCard(d,true); });
    row.addEventListener("mouseenter",function(e){ showTip(e,d); });
    row.addEventListener("mousemove",function(e){ moveTip(e); });
    row.addEventListener("mouseleave",hideTip);
    frag.appendChild(row);
  });
  box.appendChild(frag);
  box.scrollTop=0;
}

const S_BASE=16;       // tamaño del ícono al 100%
const SEP_BASE=3;      // separación entre íconos
const MAXCOLS=5;       // máximo de íconos de ancho por año
const GAP_BASE=10;     // separación entre columnas
const EMPTYW_BASE=3;   // ancho de un año sin víctimas
const ZOOM_MIN=0.3, ZOOM_MAX=2.4, ZOOM_PASO=1.25;
const ZOOM_AUTO_MAX=2.75;   // tope del agrandado automatico cuando sobra lugar
let zoom=0.8;
let zoomManual=false;      // al tocar las lupas o pellizcar, manda el usuario
let zoomRender=1;          // escala con la que se dibujó de verdad
let baseY=0;               // y del eje dentro del svg: las figuras se apoyan ahí
let ejeFijos=[];           // ticks y numeros de año: no cambian de tamaño al pellizcar
// celular: zoom visual sobre un dibujo fijo. no recalcula nada, no salta nada
const VZ_MIN=0.6, VZ_MAX=4;
// se puede alejar hasta 0.6, o más todavía si hace falta para que el dibujo
// entre entero de ancho (con pocas personas las figuras salen grandes y el
// gráfico queda muy ancho: igual se tiene que poder ver todo de un golpe)
function vzMinimo(){
  const cabe=lienW ? (plot.clientWidth-16)/lienW : VZ_MIN;
  return Math.max(0.12, Math.min(VZ_MIN, cabe));
}
let vz=1, lienW=0, lienH=0;
function lienzo(){ return plot.querySelector(".lienzo"); }
// encuadre de arranque para los datos que haya en pantalla: se ve de una
// alrededor del 50% del ancho del dibujo, sin agrandar más que el tamaño base
function vzDefecto(){
  if(!lienW) return 1;
  return Math.min(1, Math.max(vzMinimo(), hueco().w/(0.5*lienW)));
}
function hueco(){   // el espacio visible del contenedor, sin contar sus márgenes
  const cs=getComputedStyle(plot);
  return {w: plot.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
          h: plot.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)};
}
function aplicarVZ(){
  const lien=lienzo(); if(!lien) return;
  const wrap=lien.parentNode;
  const w=lienW*vz, h=lienH*vz, hu=hueco();
  // si el dibujo achicado no llena la pantalla, queda centrado y apoyado abajo,
  // no flotando arriba a la izquierda con un vacío debajo
  const anchoW=Math.max(w,hu.w), altoW=Math.max(h,hu.h);
  wrap.style.width=anchoW+"px"; wrap.style.height=altoW+"px";
  lien.style.width=lienW+"px";  lien.style.height=lienH+"px";
  lien.style.transform="translate("+((anchoW-w)/2)+"px,"+(altoW-h)+"px) scale("+vz+")";
}
// cambia el zoom dejando quieto en pantalla el punto (cx,cy) del dibujo,
// que tiene que quedar bajo el punto de pantalla (px,py)
function reencuadrar(nuevo, cx, cy, px, py){
  const lien=lienzo(); if(!lien) return;
  vz=nuevo; aplicarVZ();
  const r=lien.getBoundingClientRect();
  plot.scrollLeft += (r.left+cx*vz)-px;
  plot.scrollTop  += (r.top +cy*vz)-py;
  actualizarLupas();
}
function zoomVisual(f){
  const lien=lienzo(); if(!lien) return;
  const nuevo=Math.min(VZ_MAX,Math.max(vzMinimo(),vz*f));
  if(Math.abs(nuevo-vz)<0.001) return;
  const caja=plot.getBoundingClientRect(), r=lien.getBoundingClientRect();
  const px=caja.left+caja.width/2, py=caja.top+caja.height/2;
  reencuadrar(nuevo,(px-r.left)/vz,(py-r.top)/vz,px,py);
}

function fijarZoom(nuevo, ancla){
  zoomManual=true;
  const previo=zoom;
  nuevo=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,nuevo));
  if(Math.abs(nuevo-previo)<0.001 && !ancla) return;
  // guardar qué punto del contenido está al centro, para no perder de vista dónde estabas
  const centro=(plot.scrollLeft+plot.clientWidth/2)/previo;
  zoom=nuevo;
  drawPlot(DATA.filter(passes));
  if(ancla){
    // dejar bajo los dedos el mismo punto del dibujo que estaba antes del pellizco
    plot.scrollLeft=Math.max(0, ancla.fx*plot.scrollWidth  - ancla.offX);
    // el eje queda donde estaba en pantalla: el dibujo no se despega ni se pega al piso
    plot.scrollTop =Math.max(0, baseY - ancla.baseTop);
  } else {
    plot.scrollLeft=Math.max(0, centro*nuevo - plot.clientWidth/2);
  }
  actualizarLupas();
}
function cambiarZoom(factor){ fijarZoom(zoom*factor); }
function actualizarLupas(){
  const est=!!lienzo();
  document.getElementById("zmas").disabled   = est ? vz>=VZ_MAX-0.001 : zoom>=ZOOM_MAX-0.001;
  document.getElementById("zmenos").disabled = est ? vz<=vzMinimo()+0.001 : zoom<=ZOOM_MIN+0.001;
}
function lupa(f){ if(lienzo()) zoomVisual(f); else cambiarZoom(f); }
document.getElementById("zmas").onclick=function(){ lupa(ZOOM_PASO); };
document.getElementById("zmenos").onclick=function(){ lupa(1/ZOOM_PASO); };

function pintarAnioSel(){

  for(let i=0;i<rects.length;i++){
    rects[i].classList.toggle("on", Number(rects[i].getAttribute("data-y"))===anioSel);
  }
  const lbls=plot.querySelectorAll(".yrlbl");
  for(let i=0;i<lbls.length;i++){
    lbls[i].classList.toggle("on", Number(lbls[i].getAttribute("data-y"))===anioSel);
  }
}
function elegirAnio(y){
  anioSel = (anioSel===y) ? null : y;   // volver a tocarla la suelta
  lq.value=""; marcarBorrar();   // el buscador estorbaba al elegir una columna
  pintarAnioSel();
  drawList();
}
function soltarAnio(){
  if(anioSel===null) return;
  anioSel=null;
  pintarAnioSel();
  drawList();
}

function stackRank(d){
  const t=personType(d);
  if(t==="nino") return 0;        // niños abajo de todo
  if(t==="civil") return 1;       // civiles
  if(t==="ffaa") return 2;        // fuerzas armadas
  return 3;                       // policía / seguridad arriba de todo
}
function drawPlot(items){
  plot.innerHTML="";
  if(items.length===0){
    const e=document.createElement("div"); e.className="empty";
    e.textContent="Ninguna víctima coincide con esos filtros.";
    plot.appendChild(e); return;
  }
  const byYear={};
  items.forEach(function(d){ const g=grupoDe(d.y); (byYear[g]=byYear[g]||[]).push(d); });
  const years=[MINY]; for(let y=GRUPO_FIN+1;y<=MAXY;y++) years.push(y);

  const cntY={};
  years.forEach(function(y){ cntY[y]=(byYear[y]||[]).length; });

  const pad=30;
  const isMobile=window.matchMedia("(max-width:760px)").matches;
  const cajaW=Math.max(280, plot.clientWidth-40);
  const cajaH=Math.max(120, Math.max(220, plot.clientHeight)-44);
  const AIRE = 30;   // aire libre arriba de la columna más alta

  // medidas completas del dibujo para una escala dada
  function medidas(escala){
    const S=Math.max(6,Math.round(S_BASE*escala));
    const CELL=S+Math.max(2,Math.round(SEP_BASE*escala));
    const GAP=Math.max(4,Math.round(GAP_BASE*escala));
    const EMPTYW=Math.max(2,Math.round(EMPTYW_BASE*escala));
    const perRow={}, colW={};
    let ancho=pad, filas=1;
    years.forEach(function(y){
      const c=cntY[y];
      if(c===0){ perRow[y]=1; colW[y]=EMPTYW; ancho+=EMPTYW+2; return; }
      const pr=Math.min(MAXCOLS,c);
      perRow[y]=pr; colW[y]=pr*CELL; ancho+=pr*CELL+GAP;
      filas=Math.max(filas,Math.ceil(c/pr));
    });
    return {escala:escala,S:S,CELL:CELL,GAP:GAP,perRow:perRow,colW:colW,
            ancho:ancho-GAP+pad, alto:filas*CELL+AIRE, filas:filas};
  }

  // con pocas personas sobra lugar: agrandar hasta llenar el ancho, sin
  // pasarse de alto ni de un tamaño de figura razonable
  let plan=medidas(zoom);
  if(!zoomManual){
    if(isMobile){
      // en celular el ancho no frena, porque se arrastra de costado: manda el alto
      for(let e=zoom+0.05; e<=ZOOM_AUTO_MAX; e+=0.05){
        const t=medidas(e);
        if(t.alto>cajaH) break;
        plan=t;
      }
    } else {
      // la escala más grande que entre entera, agrandando o achicando. antes solo
      // podía agrandar: si el tamaño de arranque ya no entraba, quedaba cortado
      let entra=null;
      for(let e=ZOOM_MIN; e<=ZOOM_AUTO_MAX+0.001; e+=0.05){
        const t=medidas(e);
        if(t.alto<=cajaH && t.ancho<=cajaW) entra=t; else if(entra) break;
      }
      plan = entra || medidas(ZOOM_MIN);
      zoom = plan.escala;    // las lupas arrancan desde lo que se está viendo
    }
  }

  zoomRender=plan.escala;
  const S=plan.S, CELL=plan.CELL, GAP=plan.GAP;
  const perRowY=plan.perRow, colWY=plan.colW, maxRows=plan.filas;

  let xcur=pad;
  const centerX={};
  years.forEach(function(y){
    centerX[y]=xcur+colWY[y]/2;
    xcur += colWY[y] + (cntY[y]===0 ? 2 : GAP);   // años vacíos casi sin separación
  });
  const contentW=xcur-GAP+pad;

  const W=Math.max(plot.clientWidth-40, contentW);
  // si el dibujo no llena el ancho, centrarlo en vez de dejarlo pegado a la izquierda
  const offX=Math.max(0,(W-contentW)/2);
  if(offX>0) years.forEach(function(y){ centerX[y]+=offX; });
  const contentH=maxRows*CELL+AIRE;            // alto real que ocupan las figuras
  // en celular el alto se calcula contra el hueco real de la caja (sin el padding),
  // asi cuando el dibujo entra no queda un scroll vertical hacia arriba sobre el vacio
  const disponible=plot.clientHeight-20;
  const axisY=isMobile
      ? Math.max(disponible-34, contentH)
      : Math.max(plot.clientHeight-40, contentH);
  const H=axisY+34;
  baseY=axisY;                  // el eje es el piso del dibujo, se usa al pellizcar

  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("width",W); svg.setAttribute("height",H);

  // eje: ticks/labels solo en años con datos, evitando solapamiento
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","yr");
  let lastLabelX=-999;
  ejeFijos=[];
  years.forEach(function(y){
    const cx=centerX[y];
    if(cntY[y]>0){
      const tick=document.createElementNS(NS,"line");
      tick.setAttribute("x1",cx);tick.setAttribute("x2",cx);tick.setAttribute("y1",axisY);tick.setAttribute("y2",axisY+5);
      g.appendChild(tick); ejeFijos.push({el:tick,cx:cx});
      if(cx-lastLabelX>=(y===MINY?46:30)){
        const txt=etiquetaGrupo(y);
        const grp=document.createElementNS(NS,"g");
        grp.setAttribute("class","yrlbl"+(anioSel===y?" on":""));
        grp.setAttribute("data-y",y);
        const rx=Math.max(11,3+txt.length*3.6);
        const badge=document.createElementNS(NS,"ellipse");
        badge.setAttribute("class","yrbadge");
        badge.setAttribute("cx",cx); badge.setAttribute("cy",axisY+15);
        badge.setAttribute("rx",rx); badge.setAttribute("ry",11);
        grp.appendChild(badge);
        const t=document.createElementNS(NS,"text");
        t.setAttribute("x",cx);t.setAttribute("y",axisY+19);t.setAttribute("text-anchor","middle");
        t.textContent=txt;
        grp.appendChild(t);
        grp.addEventListener("click",function(){ if(!dragMoved) elegirAnio(y); });
        g.appendChild(grp); ejeFijos.push({el:grp,cx:cx}); lastLabelX=cx;
      }
    }
  });
  const base=document.createElementNS(NS,"line");
  base.setAttribute("x1",pad+offX);base.setAttribute("x2",contentW-pad+offX);base.setAttribute("y1",axisY);base.setAttribute("y2",axisY);
  base.setAttribute("stroke","#2e2822");
  g.appendChild(base); svg.appendChild(g);

  // zona de cada año: se puede tocar para ver solo esa columna en la lista
  years.forEach(function(y){
    if(!cntY[y]) return;
    const bg=document.createElementNS(NS,"rect");
    bg.setAttribute("class","yearbg"+(anioSel===y?" on":""));
    bg.setAttribute("data-y",y);
    bg.setAttribute("x",centerX[y]-colWY[y]/2-3);
    bg.setAttribute("y",0);
    bg.setAttribute("width",colWY[y]+6);
    bg.setAttribute("height",axisY);
    svg.appendChild(bg);
  });

  // personas
  years.forEach(function(y){
    const arr=byYear[y]; if(!arr) return;
    arr.sort(function(a,b){ const ra=stackRank(a),rb=stackRank(b); if(ra!==rb) return ra-rb; return a.f<b.f?-1:1; });
    const cx=centerX[y];
    const perRow=perRowY[y];
    arr.forEach(function(d,i){
      const rw=Math.floor(i/perRow), cl=i%perRow;
      const wide=Math.min(perRow,arr.length);
      const x=cx+(cl-(wide-1)/2)*CELL - S/2;
      const yy=axisY-6-S-rw*CELL;
      const t=personType(d);
      const gp=document.createElementNS(NS,"g");
      gp.setAttribute("class","person");
      gp.setAttribute("data-id", DATA.indexOf(d));
      gp.setAttribute("transform","translate("+x+","+yy+") scale("+(S/16)+")");
      gp.setAttribute("fill",personColor(t));
      gp.innerHTML=iconPaths(t);
      svg.appendChild(gp);
      // área de captación ampliada (toda la celda) para hover y click fáciles
      const hit=document.createElementNS(NS,"rect");
      hit.setAttribute("x",x-(CELL-S)/2); hit.setAttribute("y",yy-(CELL-S)/2);
      hit.setAttribute("width",CELL); hit.setAttribute("height",CELL);
      hit.setAttribute("class","hit");
      hit.setAttribute("fill","transparent");
      hit.style.cursor="pointer";
      hit.addEventListener("mouseenter",function(e){ showTip(e,d); });
      hit.addEventListener("mousemove",function(e){ moveTip(e); });
      hit.addEventListener("mouseleave",hideTip);
      hit.addEventListener("click",function(){ if(!dragMoved) openCard(d); });
      svg.appendChild(hit);
    });
  });

  if(isMobile){
    // en celular el dibujo queda congelado dentro de un lienzo y el zoom solo lo estira
    const wrap=document.createElement("div"); wrap.className="zoomwrap";
    const lien=document.createElement("div"); lien.className="lienzo";
    lien.appendChild(svg); wrap.appendChild(lien); plot.appendChild(wrap);
    lienW=W; lienH=H;
    vz=vzDefecto();          // cada vez que cambian los datos se reencuadra solo
    aplicarVZ(); actualizarLupas();
  } else {
    plot.appendChild(svg);
  }
  plot.scrollTop=plot.scrollHeight;
  // en móvil, abrir mostrando el año con más víctimas (donde el gráfico se ve lleno)
  if(isMobile){
    // columna del medio: aquella donde cae la persona número total/2
    let total=0;
    years.forEach(function(y){ total+=cntY[y]; });
    let acum=0, medio=null;
    for(let i=0;i<years.length;i++){
      acum+=cntY[years[i]];
      if(cntY[years[i]] && acum>=total/2){ medio=years[i]; break; }
    }
    if(medio!==null) plot.scrollLeft=Math.max(0, centerX[medio]*vz-plot.clientWidth/2);
  }
}

// ---- tooltip ----
const tip=document.getElementById("tip");

// nombre "APELLIDO, Nombre" -> "Nombre Apellido" con capitalización normal
function nombreNormal(raw){
  function cap(w){
    if(!w) return w;
    if(w.length<=2 && w===w.toUpperCase() && !/[AEIOU]/.test(w)) return w; // iniciales tipo "A."
    return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  }
  function capFrase(s){ return s.split(/\s+/).map(cap).join(" "); }
  const raws=String(raw).trim();
  if(raws.indexOf(",")>=0){
    const p=raws.split(",");
    const ape=p[0].trim(), nom=p.slice(1).join(",").trim();
    return (capFrase(nom)+" "+capFrase(ape)).trim();
  }
  return capFrase(raws); // "TRECE (13) personas..." -> se capitaliza igual
}

// categoría legible para el encabezado del tooltip / ficha
function categoriaTexto(d){
  if(d.nino) return "Niño";
  if(d.g==="Militar"){
    if(d.rama==="Ejército") return "Soldado del Ejército";
    if(d.rama==="Armada") return "Armada";
    if(d.rama==="Fuerza Aérea") return "Fuerza Aérea";
    if(d.rama==="Policía Federal") return "Policía Federal";
    if(d.rama==="Policía provincial") return "Policía provincial";
    if(d.rama==="Gendarmería / Prefectura") return "Gendarmería / Prefectura";
    if(d.rama==="Servicio Penitenciario") return "Servicio Penitenciario";
    return "Fuerzas de seguridad";
  }
  return "Civil";
}


// clave de foto a partir del nombre: "fotos/<apellido-nombre>.jpg"
function claveFoto(nombre){
  let s=nombre.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  s=s.replace(/\(h\)|\(hijo\)/g,"");
  s=s.replace(/[^a-z0-9 ]/g,"");
  s=s.replace(/\s+/g,"-").replace(/^-+|-+$/g,"");
  return s;
}
function fotoGrande(d){ return "fotos/"+claveFoto(d.n)+".jpg"; }
function fotoThumb(d){ return "fotos/"+claveFoto(d.n)+"_thumb.jpg"; }
function tieneFoto(d){ return FOTOS.has(claveFoto(d.n)); }

// las miniaturas pesan poco; se traen en segundo plano, de a pocas, para que
// al pasar el mouse ya estén en el navegador y aparezcan al instante
function precargarMiniaturas(){
  const claves=Array.from(FOTOS);
  let i=0;
  function siguiente(){
    if(i>=claves.length) return;
    const img=new Image();
    img.onload=img.onerror=siguiente;
    img.src="fotos/"+claves[i++]+"_thumb.jpg";
  }
  for(let k=0;k<4;k++) siguiente();
}

function showTip(e,d){
  const t=personType(d);
  const ico='<svg class="tico" viewBox="0 0 16 16" fill="'+personColor(t)+'">'+iconPaths(t)+'</svg>';
  tip.innerHTML='<div class="trow"><img class="tthumb" alt="">'+
                '<div><span class="tcat">'+esc(categoriaTexto(d))+'</span>'+
                '<span class="tnom">'+esc(nombreNormal(d.n))+' · '+d.y+' <span class="cruz">\u2020</span></span></div>'+
                ico+'</div>';
  const imgEl=tip.querySelector(".tthumb");
  if(tieneFoto(d)){ imgEl.src=fotoThumb(d); imgEl.style.display="block"; }
  else imgEl.remove();
  tip.style.display="block"; moveTip(e);
}
function moveTip(e){
  tip.style.left=e.clientX+"px";
  tip.style.top=e.clientY+"px";
  tip.style.transform="translate(-50%,-118%)";
  // en la lista, pegada al borde, el globo se saldria de la pantalla
  const r=tip.getBoundingClientRect();
  let dx=0;
  if(r.left<8) dx=8-r.left;
  else if(r.right>window.innerWidth-8) dx=window.innerWidth-8-r.right;
  if(dx) tip.style.left=(e.clientX+dx)+"px";
  if(r.top<8) tip.style.transform="translate(-50%,22%)";
}
function hideTip(){ tip.style.display="none"; }

// ---- pellizcar para agrandar y achicar (celular) ----
const punteros=new Map();
let pellizco=null;

function distDedos(){
  const p=Array.from(punteros.values());
  return Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
}
// mientras se pellizca el dibujo entero se estira, pero los numeros de los años
// tienen un tamaño fijo: se les aplica la escala al reves para que no cambien
function contraescalarEje(k){
  const inv=1/k;
  ejeFijos.forEach(function(o){
    o.el.setAttribute("transform",
      "translate("+o.cx+" "+baseY+") scale("+inv+") translate("+(-o.cx)+" "+(-baseY)+")");
  });
}
function soltarEje(){
  ejeFijos.forEach(function(o){ o.el.removeAttribute("transform"); });
}
function escalaPrevia(){
  const svg=plot.querySelector("svg");
  const m=svg && /scale\(([\d.]+)\)/.exec(svg.style.transform||"");
  return m ? parseFloat(m[1]) : 1;
}
plot.addEventListener("pointerdown",function(e){
  if(e.pointerType==="mouse") return;
  // si un dedo se levantó fuera del gráfico quedó anotado de gusto: el primer
  // dedo de un toque nuevo limpia esos fantasmas, si no un solo dedo hacía zoom
  if(e.isPrimary){ punteros.clear(); pellizco=null; }
  punteros.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(punteros.size===2){
    dragging=false; dragMoved=true;      // cortar el arrastre de un dedo
    plot.classList.remove("drag");
    hideTip();
    const p=Array.from(punteros.values());
    const mx=(p[0].x+p[1].x)/2, my=(p[0].y+p[1].y)/2;
    const caja=plot.getBoundingClientRect();
    const lien=lienzo();
    if(lien){
      // el punto del dibujo que está bajo los dedos, para no soltarlo nunca
      const r=lien.getBoundingClientRect();
      pellizco={estatico:true, dist:distDedos(), vz:vz,
                cx:(mx-r.left)/vz, cy:(my-r.top)/vz};
      return;
    }
    pellizco={
      dist:distDedos(),
      zoom:zoomRender,                   // la escala que se ve, no la nominal
      offX:mx-caja.left,
      baseTop: baseY-plot.scrollTop,     // a qué altura de la caja está el eje ahora
      fx: plot.scrollWidth  ? (plot.scrollLeft+(mx-caja.left))/plot.scrollWidth  : 0
    };
    const svg=plot.querySelector("svg");
    if(svg){
      const r=svg.getBoundingClientRect();
      // horizontal: desde los dedos. vertical: desde el eje, que es donde se
      // apoyan las figuras y adonde va a volver el dibujo al soltar
      svg.style.transformOrigin=(mx-r.left)+"px "+baseY+"px";
    }
  }
});
plot.addEventListener("pointermove",function(e){
  if(!punteros.has(e.pointerId)) return;
  punteros.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!pellizco || punteros.size!==2) return;
  e.preventDefault();
  if(pellizco.estatico){
    const p=Array.from(punteros.values());
    const nuevo=Math.min(VZ_MAX,Math.max(vzMinimo(), pellizco.vz*(distDedos()/pellizco.dist)));
    reencuadrar(nuevo, pellizco.cx, pellizco.cy, (p[0].x+p[1].x)/2, (p[0].y+p[1].y)/2);
    return;
  }
  // vista previa barata: escalar el dibujo ya hecho, sin volver a armarlo
  const objetivo=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN, pellizco.zoom*(distDedos()/pellizco.dist)));
  const svg=plot.querySelector("svg");
  const k=objetivo/pellizco.zoom;
  if(svg){ svg.style.transform="scale("+k+")"; contraescalarEje(k); }
});
function finPellizco(e){
  if(!punteros.has(e.pointerId)) return;
  punteros.delete(e.pointerId);
  if(!pellizco || punteros.size>=2) return;
  if(pellizco.estatico){
    pellizco=null;                       // nada que rehacer: ya está dibujado
    // el dedo que queda sigue arrastrando desde donde está ahora, sin pegar un tirón
    const q=Array.from(punteros.values())[0];
    if(q){ dsx=q.x; dsy=q.y; dsl=plot.scrollLeft; dst=plot.scrollTop; dragging=true; dragMoved=true; }
    else dragging=false;
    return;
  }
  const k=escalaPrevia();
  const svg=plot.querySelector("svg");
  if(svg){ svg.style.transform=""; svg.style.transformOrigin=""; }
  soltarEje();
  const ancla=pellizco;
  pellizco=null;
  fijarZoom(ancla.zoom*k, ancla);        // ahora sí, redibujo nítido
}
// en window: si el dedo se levanta fuera del gráfico igual queda registrado
window.addEventListener("pointerup",finPellizco);
window.addEventListener("pointercancel",finPellizco);

// ---- arrastrar para desplazar ----
let dragging=false, dragMoved=false, dsx=0, dsy=0, dsl=0, dst=0;
plot.addEventListener("pointerdown",function(e){
  if(e.pointerType==="mouse" && e.button!==0) return;
  dragging=true; dragMoved=false;
  dsx=e.clientX; dsy=e.clientY; dsl=plot.scrollLeft; dst=plot.scrollTop;
});
window.addEventListener("pointermove",function(e){
  if(pellizco || !dragging) return;
  const dx=e.clientX-dsx, dy=e.clientY-dsy;
  if(Math.abs(dx)>4||Math.abs(dy)>4){ dragMoved=true; plot.classList.add("drag"); hideTip(); }
  plot.scrollLeft=dsl-dx; plot.scrollTop=dst-dy;
});
function finDrag(){ dragging=false; plot.classList.remove("drag"); setTimeout(function(){ dragMoved=false; },0); }
window.addEventListener("pointerup",finDrag);
window.addEventListener("pointercancel",finDrag);

const card=document.getElementById("card"), scrim=document.getElementById("scrim");
const MES=["","enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

// El libro arma cada ficha en dos bloques: "CASO [n] —" el hecho y
// "SEMBLANZA —" la biografía. Se separan para mostrar primero quién era.
const RE_CASO=/^CASO\s*\[?\d*\]?\s*[—–-]\s*/;
function partirRelato(txt){
  const s=String(txt||"");
  const i=s.indexOf("SEMBLANZA");
  const caso=(i<0 ? s : s.slice(0,i)).trim().replace(RE_CASO,"").trim();
  const semblanza=i<0 ? "" : s.slice(i).trim().replace(/^SEMBLANZA\s*[—–-]\s*/,"");
  return {caso:caso, semblanza:semblanza};
}
const ROM=["","I","II","III"];
function fmtFecha(f){ const p=f.split("-"); return (+p[2])+" de "+MES[+p[1]]+" de "+p[0]; }
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
function markPerson(d){
  // quitar recuadro anterior
  const prev=document.querySelector("rect.selbox");
  if(prev) prev.remove();
  const id=DATA.indexOf(d);
  const el=document.querySelector('g.person[data-id="'+id+'"]');
  if(el){
    const svg=el.ownerSVGElement;
    const tr=el.getAttribute("transform");     // translate(x,y) scale(k)
    const m=/translate\(([-\d.]+),([-\d.]+)\) scale\(([-\d.]+)\)/.exec(tr);
    if(m){
      const x=+m[1], y=+m[2], k=+m[3], sz=16*k;
      const box=document.createElementNS(NS,"rect");
      box.setAttribute("class","selbox");
      box.setAttribute("x", x-3);
      box.setAttribute("y", y-3);
      box.setAttribute("width", sz+6);
      box.setAttribute("height", sz+6);
      box.setAttribute("rx", 3);
      svg.appendChild(box);
    }
  }
}
// la cruz va pegada a la ultima palabra del nombre: si el nombre ocupa dos
// renglones baja con ella, nunca queda sola colgando en el renglon siguiente
function nombreConCruz(raw){
  const nom=nombreNormal(raw), corte=nom.lastIndexOf(" ");
  const antes=corte<0 ? "" : esc(nom.slice(0,corte+1));
  const ultima=corte<0 ? nom : nom.slice(corte+1);
  return antes+'<span class="junto">'+esc(ultima)+CRUZ_NM+'</span>';
}
const CRUZ_NM='<svg class="cruznm" viewBox="0 0 24 36" aria-hidden="true">'+
  '<rect x="9.2" y="0" width="5.6" height="36" fill="#fff"></rect>'+
  '<rect x="1.6" y="8.6" width="20.8" height="5.6" fill="#fff"></rect></svg>';
function openCard(d, dejarPanel){
  hideTip();          // con el dedo no llega el mouseleave que lo cerraria
  if(!dejarPanel) cerrarPaneles();   // que la ficha no quede tapada por el panel
  markPerson(d);
  const lugar=[d.l,d.p].filter(Boolean).join(", ");
  const meta=[];
  if(d.f)  meta.push(["Fecha",fmtFecha(d.f)]);
  if(lugar) meta.push(["Lugar",lugar]);
  if(d.fu) meta.push(["Condición",d.fu]);
  if(d.edad!==null && d.edad!==undefined) meta.push(["Edad",d.edad+" años"]);
  if(d.t)  meta.push(["Tipo de hecho",d.t]);
  if(d.org) meta.push(["Responsable",d.org]);
  let html="";
  html+='<div class="grip"></div>';
  html+='<div class="xwrap"><button class="x" id="cx">&times;</button></div>';
  const _t=personType(d);
  const _ico='<svg class="nmico" viewBox="0 0 16 16" fill="'+personColor(_t)+'">'+iconPaths(_t)+'</svg>';
  html+='<div class="nmrow">'+_ico+'<div><div class="nmcat">'+esc(categoriaTexto(d))+'</div>'+
        '<div class="nm">'+nombreConCruz(d.n)+'</div></div></div>';
  if(tieneFoto(d)){
    html+='<img class="foto show" src="'+fotoGrande(d)+'" alt="" loading="lazy">';
  }
  if(meta.length){
    html+='<dl class="meta">';
    meta.forEach(function(m){
      html+='<dt>'+m[0]+'</dt><dd>'+esc(m[1])+
            (m[0]==="Fecha" ? ' <span class="cruz">\u2020</span>' : '')+'</dd>';
    });
    html+='</dl>';
  }
  const partes=partirRelato(d.d);
  if(partes.semblanza) html+='<div class="rel">'+esc(partes.semblanza)+'</div>';
  if(partes.caso)      html+='<div class="rel">'+esc(partes.caso)+'</div>';
  // el autor es el mismo para las 1050, así que va acá y no repetido en el json
  html+='<div class="src">Un aporte a la verdad, vol. '+ROM[d.vol]+', pág. '+d.pg+
        ' \u2014 Jorge Héctor Di Pasquale.</div>';
  card.innerHTML=html;
  card.scrollTop=0;   // siempre desde arriba, no donde quedo la ficha anterior
  document.getElementById("cx").onclick=closeCard;
  card.classList.add("show"); scrim.classList.add("show");
}

  const panelAbierto = panelFiltros.classList.contains("abierto") ||
                       panelLista.classList.contains("abierto");
  if(!panelAbierto) scrim.classList.remove("show");
}

// ===================== ARRASTRE CON EL DEDO (scroll por drag) =====================
function habilitarArrastre(el, ejes){
  if(!el) return;
  let down=false, moved=false, sx=0, sy=0, sl=0, st=0;
  const horiz = ejes.indexOf("x")>=0, vert = ejes.indexOf("y")>=0;
  el.addEventListener("pointerdown",function(e){
    if(e.pointerType==="mouse" && e.button!==0) return;
    down=true; moved=false; sx=e.clientX; sy=e.clientY; sl=el.scrollLeft; st=el.scrollTop;
  });
  el.addEventListener("pointermove",function(e){
    if(!down) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>5||Math.abs(dy)>5) moved=true;
    if(horiz) el.scrollLeft=sl-dx;
    if(vert)  el.scrollTop=st-dy;
  });
  function fin(){ down=false; setTimeout(function(){ moved=false; },0); }
  el.addEventListener("pointerup",fin);
  el.addEventListener("pointercancel",fin);
  el.addEventListener("pointerleave",fin);
  // evitar que un arrastre dispare click en hijos
  el.addEventListener("click",function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); } },true);
}
